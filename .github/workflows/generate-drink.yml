name: Generate Daily Drink Post & Deploy

on:
  schedule:
    - cron: '0 8 * * *' # Runs daily at 8 AM UTC
  workflow_dispatch: # Enables the manual "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run script to generate drink post
        run: node scripts/generate-post.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and push generated post
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Add automated AI drink spotlight post"
          branch: main
          internal_git_options: '--rebase'

      - name: Build Astro site
        run: npm run build

      - name: Upload page artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
