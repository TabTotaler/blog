name: Generate Daily Drink Post

on:
  schedule:
    - cron: '0 8 * * *' # Runs daily at 8 AM UTC
  workflow_dispatch: # Enables the manual "Run workflow" button

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run script to generate drink post
        run: node scripts/generate-post.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and push generated post
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Add automated AI drink spotlight post"
          branch: main
