name: RSS to Twitter

on:
  schedule:
    - cron: "30 9 * * *" # ~90 min after the 8 AM UTC deploy
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Send RSS items to Twitter
        uses: azu/rss-to-twitter@v2
        with:
          RSS_URL: "https://blog.tabtotaler.app/rss.xml"
          TWEET_TEMPLATE: 'New drink spotlight: "%title%" 🍹 Read more: %url%'
          UPDATE_WITHIN_MINUTES: 1440 # only used for manual runs
          TWITTER_APIKEY: ${{ secrets.TWITTER_APIKEY }}
          TWITTER_APIKEY_SECRET: ${{ secrets.TWITTER_APIKEY_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
